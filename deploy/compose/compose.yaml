# Prayog local stack. Run through the Makefile (`make up`, `make down`, `make smoke`), which passes the root .env.
#
# Profiles (BUILD_PLAN 16.2 #28):
#   infra  PostgreSQL, Kafka, Redis, Keycloak, Traefik (+ placeholders for app. and api. until S10/S18)
#   app    exchange, post-trade, web (from S10)
#   obs    Prometheus, Grafana (S21)
#
# Every service has a health check; `depends_on: condition: service_healthy` gives the start order, and
# `docker compose up --wait` returns only when everything is healthy.
# Host ports bind to 127.0.0.1 only: nothing here is reachable from the local network.
name: prayog

services:

  # ---- data ---------------------------------------------------------------------------------------------------------

  postgres:
    image: postgres:16.15-alpine
    profiles: [infra]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env} # read by the init script
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data volume: creates Keycloak's own database and user.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    profiles: [infra]
    # Append-only file: the leaderboard survives a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- messaging ----------------------------------------------------------------------------------------------------

  # One node that is both broker and controller (KRaft: Kafka's built-in Raft quorum, no ZooKeeper).
  # Two listeners: INTERNAL for containers (kafka:9092) and EXTERNAL for tools on the host (localhost:9094).
  # A client connects to whichever address it knows, then uses the address the broker *advertises* for that listener.
  kafka:
    image: apache/kafka:4.3.1
    profiles: [infra]
    environment:
      CLUSTER_ID: h_2sgux7TYyMCjKwZ_g9gA # fixed, so the data volume always matches; formats storage on first start
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # A single node can only keep one copy of Kafka's internal topics.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (kafka-init), never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["127.0.0.1:9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # One-off job: creates the exchange's event topic (BUILD_PLAN 16.2 #18), then exits.
  kafka-init:
    image: apache/kafka:4.3.1
    profiles: [infra]
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: >-
      --bootstrap-server kafka:9092 --create --if-not-exists
      --topic prayog.exchange.events.v1 --partitions 3 --replication-factor 1
    restart: "no"

  # ---- identity -----------------------------------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: [infra]
    # start-dev: HTTP allowed, themes not cached. Fine locally; a hosted deployment uses `start` with TLS.
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      # Tokens say iss=http://auth.prayog.localhost/realms/prayog however Keycloak is reached (BUILD_PLAN 16.2 #26).
      KC_HOSTNAME: http://auth.prayog.localhost
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
      # Substituted into the realm file during import (${...} placeholders); never committed.
      PRAYOG_BOT_DEMO_SECRET: ${PRAYOG_BOT_DEMO_SECRET:?set in .env}
      PRAYOG_AGENTS_SECRET: ${PRAYOG_AGENTS_SECRET:?set in .env}
      PRAYOG_TRADER1_PASSWORD: ${PRAYOG_TRADER1_PASSWORD:?set in .env}
      PRAYOG_OPS1_PASSWORD: ${PRAYOG_OPS1_PASSWORD:?set in .env}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; bash can open a TCP connection itself. Port 9000 is Keycloak's management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.auth.rule: Host(`auth.prayog.localhost`)
      traefik.http.routers.auth.entrypoints: web
      traefik.http.services.auth.loadbalancer.server.port: "8080"

  # ---- edge ---------------------------------------------------------------------------------------------------------

  # Reverse proxy: one port (80) on the host, routed by host name to containers that opt in with labels.
  traefik:
    image: traefik:v3.7.13
    profiles: [infra]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --ping=true
    ports: ["127.0.0.1:80:80"]
    volumes:
      # Read-only: Traefik only watches containers to discover their labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.prayog.localhost`)
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.routers.dashboard.service: api@internal

  # Placeholders so app. and api. answer before the web app (S18) and gateway (S10) exist. Each prints the request it
  # received. Remove them when the real services take over the host names.
  app-placeholder:
    image: traefik/whoami:v1.12.0
    profiles: [infra]
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: Host(`app.prayog.localhost`)
      traefik.http.routers.app.entrypoints: web
    # No health check: a scratch image with no shell; `--wait` waits for it to be running.

  api-placeholder:
    image: traefik/whoami:v1.12.0
    profiles: [infra]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.prayog.localhost`)
      traefik.http.routers.api.entrypoints: web

volumes:
  postgres-data:
  redis-data:
  kafka-data:
