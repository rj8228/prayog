# Serves the built web app. /api never reaches here: Traefik routes it to the exchange first.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed asset files never change, so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path (e.g. /callback) gets index.html and the router takes over.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
