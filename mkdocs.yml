# Documentation site for Prayog, published to GitHub Pages by .github/workflows/pages.yml.
# Build locally:  make docs        (strict build into site/ plus the link check)
# Preview:        make docs-serve  (live reload at http://127.0.0.1:8000/prayog/)
site_name: Prayog
site_description: A simulated stock exchange and bot arena. Simulated traders create the market; people trade by hand or with bots.
site_url: https://rj8228.github.io/prayog/
repo_url: https://github.com/rj8228/prayog
repo_name: rj8228/prayog
edit_uri: edit/main/docs/
copyright: Prayog is a learning project. Public knowledge and textbook algorithms only.

docs_dir: docs
site_dir: site
strict: true

# Build helpers live next to the docs but are not part of the site.
exclude_docs: |
  _tools/

hooks:
  - docs/_tools/hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  icon:
    logo: material/chart-line-variant
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
    - toc.follow

plugins:
  - search

extra_css:
  - assets/site.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

