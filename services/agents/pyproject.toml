[project]
name = "prayog-agents"
version = "0.1.0"
description = "Simulated traders that use the public Prayog API."
requires-python = ">=3.12,<3.13"
dependencies = ["prayog-sdk"]

[tool.uv.sources]
prayog-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prayog_agents"]
