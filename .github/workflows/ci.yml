name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compile + unit tests (Surefire) + integration tests (Failsafe, Docker is available) + Spotless check
      - run: ./mvnw -B verify

  replay-check:
    name: Replay determinism check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Records a multi-threaded session through the pipeline, replays its input journal into a fresh engine and
      # requires the same SHA-256 over the event log (BUILD_PLAN 16.1 #15). Also part of `verify`; a separate job
      # makes a determinism break visible by name.
      - run: make replay-check

  stack:
    name: Local stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Random throwaway secrets, exactly as a developer gets them; nothing secret is stored in the repo.
      - run: make env
      # Starts the infra profile and waits until every service reports healthy (S2 acceptance).
      - run: make up
      - run: make smoke
      - name: Show service state and logs
        if: failure()
        run: |
          make ps
          docker compose --env-file .env -f deploy/compose/compose.yaml --profile '*' logs --tail=200
      - if: always()
        run: make down

  python:
    name: Python (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tag is published
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r fmt:check
      - run: pnpm -r test
      - run: pnpm -r build
