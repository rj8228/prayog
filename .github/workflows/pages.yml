# Builds the documentation site with MkDocs Material and publishes it to GitHub Pages
# (https://rj8228.github.io/prayog/). The build is strict, so a broken link between docs fails it, and
# docs/_tools/check_links.py then checks every href/src in the built site, including the interactive HTML pages.
# Same commands locally: make docs
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/_tools/requirements.txt
      - name: Install MkDocs Material (pinned)
        run: pip install -r docs/_tools/requirements.txt
      - name: Build site
        run: mkdocs build --strict
      - name: Check links in the built site
        run: python docs/_tools/check_links.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
